<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2EEE2" />
    <title>Brink</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B3261E'/%3E%3Cpath d='M10 7h7.5c4 0 6 1.8 6 4.6 0 2-1.1 3.3-2.9 3.9 2.3.5 3.6 2 3.6 4.3 0 3.2-2.4 5.2-6.6 5.2H10zm4.2 3.4v4.3h2.9c1.6 0 2.4-.8 2.4-2.1s-.8-2.2-2.4-2.2zm0 7.5v4.7h3.3c1.8 0 2.7-.9 2.7-2.4s-.9-2.3-2.7-2.3z' fill='%23F2EEE2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logotype" aria-label="Brink"><span class="logo-box">B</span>RINK</span>
          <span class="game-name" id="game-name">Board</span>
        </div>
        <div class="top-actions">
          <span class="phase-label" id="phase-label" aria-live="polite">—</span>
        </div>
      </header>

      <nav class="trt" aria-label="Turn record">
        <div class="trt-head">
          <span class="trt-title">Turn<br />record</span>
          <div class="trt-buttons">
            <button class="ctl" id="prev" type="button" aria-label="Previous phase">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
            </button>
            <button class="ctl play" id="play" type="button" aria-pressed="false" aria-label="Play replay">
              <svg viewBox="0 0 16 16" aria-hidden="true" class="i-play"><path d="M5 3.2v9.6L12.6 8z" /></svg>
              <svg viewBox="0 0 16 16" aria-hidden="true" class="i-pause"><path d="M4.5 3.5h2.6v9H4.5zM8.9 3.5h2.6v9H8.9z" /></svg>
            </button>
            <button class="ctl" id="next" type="button" aria-label="Next phase">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
            </button>
          </div>
        </div>
        <ol class="trt-years" id="trt-years"></ol>
        <div class="trt-deadline" id="trt-deadline" hidden></div>
      </nav>

      <main class="stage" id="stage">
        <div class="map" id="map"></div>
        <div class="neatline" aria-hidden="true"></div>
        <div class="cartouche" aria-hidden="true">
          <span class="cartouche-logo"><span class="logo-box">B</span>RINK</span>
          <span class="cartouche-sub" id="cartouche-years">The world</span>
        </div>
        <div class="zoom-ctl" role="group" aria-label="Zoom">
          <button class="zb" id="zoom-in" type="button" aria-label="Zoom in">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          </button>
          <button class="zb" id="zoom-out" type="button" aria-label="Zoom out">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg>
          </button>
          <button class="zb fit" id="zoom-reset" type="button" aria-label="Fit board to screen">Fit</button>
        </div>
        <div class="legend" id="legend">
          <button class="legend-toggle" id="legend-toggle" type="button" aria-expanded="false" aria-controls="legend-body">
            <span>Terrain &amp; unit key</span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" /></svg>
          </button>
          <div class="legend-body" id="legend-body"></div>
        </div>
        <div class="selection" id="selection" hidden aria-live="polite"></div>
        <div class="tooltip" id="tooltip" hidden role="tooltip"></div>
      </main>

      <aside class="panel" id="panel" aria-label="Player aid">
        <button class="sheet-handle" id="sheet-handle" type="button" aria-expanded="false" aria-controls="panel-body">
          <span class="grip" aria-hidden="true"></span>
          <span id="sheet-summary">Player aid</span>
        </button>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>
    <div class="pages" id="pages" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
