<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Brink · Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172131'/%3E%3Cpath d='M7 22 16 8l9 14z' fill='none' stroke='%23E6EAF0' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18' r='2.4' fill='%23C8501E'/%3E%3C/svg%3E" />
    <script>
      // apply the theme before first paint (main.ts keeps it in sync afterwards)
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = q || localStorage.getItem("brink.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 23 16 7l10 16z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
            <circle cx="16" cy="18.5" r="2.6" fill="#C8501E" />
          </svg>
          <span class="wordmark">Brink</span>
          <span class="sub" id="game-name">Board</span>
        </div>
        <div class="top-actions">
          <span class="phase-chip" id="phase-label" aria-live="polite">—</span>
          <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
        </div>
      </header>

      <main class="stage" id="stage">
        <div class="map" id="map"></div>
        <div class="zoom-ctl" role="group" aria-label="Zoom">
          <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button class="icon-btn" id="zoom-reset" type="button" aria-label="Fit board to screen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
        </div>
        <div class="legend" id="legend">
          <button class="legend-toggle" id="legend-toggle" type="button" aria-expanded="false" aria-controls="legend-body">
            Legend
          </button>
          <div class="legend-body" id="legend-body"></div>
        </div>
        <div class="selection" id="selection" hidden aria-live="polite"></div>
        <div class="tooltip" id="tooltip" hidden role="tooltip"></div>
      </main>

      <aside class="panel" id="panel" aria-label="Game state">
        <button class="sheet-handle" id="sheet-handle" type="button" aria-expanded="false" aria-controls="panel-body">
          <span class="grip" aria-hidden="true"></span>
          <span id="sheet-summary">Game state</span>
        </button>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <footer class="timeline" aria-label="Replay">
        <div class="tl-buttons">
          <button class="icon-btn" id="prev" type="button" aria-label="Previous phase">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <button class="icon-btn play" id="play" type="button" aria-pressed="false" aria-label="Play replay">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="i-play"><path d="M8 5.5v13l10.5-6.5z" /></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M8 5h3v14H8zM13 5h3v14h-3z" /></svg>
          </button>
          <button class="icon-btn" id="next" type="button" aria-label="Next phase">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
        <div class="tl-track">
          <input type="range" id="scrubber" min="0" max="0" step="1" value="0" aria-label="Phase" />
          <div class="ticks" id="ticks"></div>
        </div>
        <div class="tl-hint" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd></div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
