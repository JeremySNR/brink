# Brink board definition: the single source of truth for the map.
#
# The geometry pipeline (src/brink/geo) turns this file plus Natural Earth data
# into build/map.json (the engine's graph) and web/public/board.json (the drawn board).
#
# Coordinates are [lon, lat] in degrees. The board is cut at the seam meridian below,
# so the Pacific wraps off both edges (like a Risk board). Longitudes west of the seam
# are shifted +360 so every coordinate sits in [seam, seam + 360).
#
# Land provinces say how to assemble them from Natural Earth:
#   countries: [ISO_A3, ...]         whole countries (ne_10m_admin_0_countries, ADM0_A3)
#   admin1: {country: ISO_A3, ...}   part of a country, by first-level region:
#       iso: [ISO 3166-2 codes]       or
#       names: [region names]         or
#       lon_between: [min, max]       region centroid longitude range (used for Russia)
#   clip: [min_lon, min_lat, max_lon, max_lat]   drop parts outside this box (overseas territories)
#   min_area_km2: drop islands smaller than this (default 2500)
#
# Sea zones are Voronoi cells of their seed points, clipped to the ocean.
# Chokepoints are carved out of the surrounding seas, either as a circle
# (point + radius_km) or from their own seeds.

board:
  name: Brink
  version: 0
  seam_lon: -168.6          # board edge; Alaska sits just east of it, Chukotka just west
  projection: eqearth       # Equal Earth, central meridian = seam_lon + 180
  lat_range: [-58, 84]
  start_year: 2031

powers:
  USA: {name: United States, adjective: American, nuclear: true}
  CHN: {name: China, adjective: Chinese, nuclear: true}
  EU:  {name: European Union, adjective: European, nuclear: true}
  RUS: {name: Russia, adjective: Russian, nuclear: true}
  IND: {name: India, adjective: Indian, nuclear: true}
  JPN: {name: Japan, adjective: Japanese, nuclear: false}
  GLF: {name: Gulf, adjective: Gulf, nuclear: false}

# ---------------------------------------------------------------- home centres (22)
homes:
  # United States
  WAS:
    name: Washington
    owner: USA
