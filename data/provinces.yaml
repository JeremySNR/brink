                                  US-VA, US-WV, US-NC, US-SC, US-GA, US-FL, US-AL, US-MS, US-TN, US-KY, US-OH,
                                  US-IN, US-IL, US-MI, US-WI]}
  TEX:
    name: Texas
    owner: USA
    admin1: {country: USA, iso: [US-TX, US-OK, US-KS, US-NE, US-SD, US-ND, US-MN, US-IA, US-MO, US-AR, US-LA]}
  CAL:
    name: California
    owner: USA
    admin1: {country: USA, iso: [US-CA, US-OR, US-WA, US-NV, US-ID, US-MT, US-WY, US-UT, US-CO, US-AZ, US-NM]}
  ALA:
    name: Alaska
    owner: USA
    admin1: {country: USA, iso: [US-AK]}
    clip: [-168.6, 50, -129, 72]

  # China
  BEI:
    name: Beijing
    owner: CHN
    admin1: {country: CHN, names: [Beijing, Tianjin, Hebei, Shanxi, Inner Mongolia, Liaoning, Jilin, Heilongjiang,
                                   Shanghai, Jiangsu, Zhejiang, Anhui, Shandong, Henan, Hubei, Shaanxi, Ningxia]}
  GUA:
    name: Guangzhou
    owner: CHN
    admin1: {country: CHN, names: [Guangdong, Guangxi, Hainan, Fujian, Jiangxi, Hunan, Yunnan, Guizhou, Sichuan,
                                   Chongqing, Hong Kong, Macau]}
  XIN:
    name: Xinjiang
    owner: CHN
    admin1: {country: CHN, names: [Xinjiang, Xizang, Tibet, Qinghai, Gansu]}

  # European Union (expanded, 2030s)
  PAR:
    name: Paris
    owner: EU
    countries: [FRA, BEL, NLD, LUX, ESP, PRT, IRL, AND, MCO]
    clip: [-25, 34, 20, 60]
  BER:
    name: Berlin
    owner: EU
    countries: [DEU, POL, CZE, SVK, AUT, CHE, LIE, DNK, SWE, FIN, NOR, ISL, EST, LVA, LTU]
    clip: [-25, 45, 45, 72]
  ROM:
    name: Rome
    owner: EU
    countries: [ITA, SVN, HRV, HUN, ROU, BGR, GRC, CYP, MLT, BIH, SRB, MNE, MKD, ALB, KOS, SMR, VAT]
    clip: [5, 34, 35, 49]

  # Russia (split by region centroid longitude)
  MOS:
    name: Moscow
    owner: RUS
    admin1: {country: RUS, lon_between: [0, 60]}
  SIB:
    name: Siberia
    owner: RUS
    admin1: {country: RUS, lon_between: [60, 108]}
  VLA:
    name: Vladivostok
    owner: RUS
    admin1: {country: RUS, lon_between: [108, 191.4]}

  # India
  DEL:
    name: Delhi
    owner: IND
    admin1: {country: IND, names: [Jammu and Kashmir, Ladakh, Himachal Pradesh, Punjab, Chandigarh, Haryana, Delhi,
                                   Uttarakhand, Uttar Pradesh, Rajasthan, Bihar, Madhya Pradesh]}
  MUM:
    name: Mumbai
    owner: IND
    admin1: {country: IND, names: [Gujarat, Maharashtra, Goa, Karnataka, Kerala, Dadra and Nagar Haveli and Daman and Diu,
                                   Dadra and Nagar Haveli, Daman and Diu, Lakshadweep]}
  CHE:
    name: Chennai
    owner: IND
    admin1: {country: IND, names: [Tamil Nadu, Puducherry, Andhra Pradesh, Telangana, Odisha, Chhattisgarh, Jharkhand,
                                   West Bengal, Sikkim, Assam, Meghalaya, Tripura, Mizoram, Manipur, Nagaland,
                                   Arunachal Pradesh, Andaman and Nicobar]}

  # Japan
  TOK:
    name: Tokyo
    owner: JPN
    admin1: {country: JPN, names: [Hokkaido, Aomori, Iwate, Miyagi, Akita, Yamagata, Fukushima, Ibaraki, Tochigi,
                                   Gunma, Saitama, Chiba, Tokyo, Kanagawa, Niigata, Nagano, Yamanashi]}
    min_area_km2: 500
  OSA:
    name: Osaka
    owner: JPN
    admin1: {country: JPN, names: [Toyama, Ishikawa, Fukui, Gifu, Shizuoka, Aichi, Mie, Shiga, Kyoto, Osaka, Hyogo,
                                   Nara, Wakayama, Tottori, Shimane, Okayama, Hiroshima, Yamaguchi, Tokushima,
                                   Kagawa, Ehime, Kochi]}
    min_area_km2: 500
  OKI:
    name: Kyushu & Okinawa
    owner: JPN
    admin1: {country: JPN, names: [Fukuoka, Saga, Nagasaki, Kumamoto, Oita, Miyazaki, Kagoshima, Okinawa]}
    min_area_km2: 100

  # Gulf
  RIY:
    name: Riyadh
    owner: GLF
    countries: [KWT, BHR, QAT]
    admin1: {country: SAU, names: [Riyadh, Eastern Province, Ash Sharqiyah, Al Qassim, Ha'il, Al Jawf,
                                   Northern Borders, Al Hudud ash Shamaliyah]}
  DUB:
    name: Dubai
    owner: GLF
    countries: [ARE, OMN]
  JED:
    name: Jeddah
    owner: GLF
    admin1: {country: SAU, names: [Makkah, Mecca, Medina, Al Madinah, Tabuk, Asir, 'Asir, Al Bahah, Jizan, Jazan, Najran]}

