  HOR: {name: Hormuz & Persian Gulf, seeds: [[50.5, 27.5], [56.3, 26.5], [53, 25.5]], bounds: [47.5, 23.5, 57.2, 30.5]}
  MLC: {name: Malacca, point: [100.0, 3.5], radius_km: 280}
  TWS: {name: Taiwan Strait, point: [119.7, 24.2], radius_km: 170}
  PAN: {name: Panama, point: [-79.6, 8.5], radius_km: 200}
  BRS: {name: Bering Strait, point: [-168.9, 65.5], radius_km: 220, opens: 2034}

# Links the geometry can't see: canals, narrow straits, wraps across the seam.
adjacency_overrides:
  add:
    - [SUZ, EME, fleet]        # Suez Canal
    - [BRS, ARO, fleet]
    - [GBR, PAR, army]         # Channel Tunnel
    - [BER, PAR, fleet]        # Kiel/Danish straits handled by shared coast; keep explicit
  remove: []

trade_routes:
  - {id: TRA, name: Transatlantic, ends: [WAS, PAR], path: [NAO]}
  - {id: SAT, name: South Atlantic, ends: [TEX, BRA], path: [CAR, MAO]}
  - {id: CAP, name: Cape, ends: [PAR, ZAF], path: [MAO, SAO]}
  - {id: TPA, name: Transpacific, ends: [CAL, TOK], path: [NEP, NWP]}
  - {id: SPR, name: South Pacific, ends: [CAL, AUS], path: [NEP, CPA, CTS]}
  - {id: INT, name: Interoceanic, ends: [WAS, CAL], path: [CAR, PAN, EPA]}
  - {id: CSE, name: China Seas, ends: [GUA, OKI], path: [TWS, ECS]}
  - {id: MLR, name: Malacca, ends: [CHE, GUA], path: [BOB, MLC, SCS]}
  - {id: SUR, name: Suez, ends: [ROM, MUM], path: [EME, SUZ, ARA]}
  - {id: GLR, name: Gulf, ends: [RIY, MUM], path: [HOR, ARA]}
  - {id: GAR, name: Gulf–Asia, ends: [RIY, GUA], path: [HOR, ARA, BOB, MLC, SCS]}
  - {id: IOR, name: Indian Ocean, ends: [MUM, ZAF], path: [ARA, IOC, MOZ]}
  - {id: BSR, name: Black Sea, ends: [ROM, UKR], path: [EME, BOS, BLK]}
  - {id: NSR, name: Northern Sea, ends: [VLA, PAR], path: [BRS, ARO, NWS, NTH], opens: 2034}

