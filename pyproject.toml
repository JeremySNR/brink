[project]
name = "brink"
version = "0.1.0"
description = "Brink: a modern great-power variant of Diplomacy, with a rules engine, bots and simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "networkx>=3.2",
]

[project.optional-dependencies]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.scripts]
brink = "brink.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "diplomacy==1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
